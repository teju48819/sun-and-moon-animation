<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sun & Moon Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(to top, #87ceeb, #f0f8ff);
            transition: background 2s ease;
        }

        .sky {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .sun, .moon {
            position: absolute;
            top: 70%;
            left: -100px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: yellow;
            animation: move-sun 10s linear infinite alternate;
        }

        .moon {
            background: #f0f0f0;
            animation: move-moon 10s linear infinite alternate;
        }

        /* Sun animation */
        @keyframes move-sun {
            0% { left: -100px; top: 70%; }
            50% { left: 50%; top: 20%; }
            100% { left: 100%; top: 70%; }
        }

        /* Moon animation */
        @keyframes move-moon {
            0% { left: 100%; top: 70%; }
            50% { left: 50%; top: 20%; }
            100% { left: -100px; top: 70%; }
        }

        /* Switch background */
        .day {
            background: linear-gradient(to top, #0da0da, #0f7fe1);
        }

        .night {
            background: linear-gradient(to top, #0b0c3f, #1a1a4a);
        }
    </style>
</head>
<body class="day">
    <div class="sky">
        <div class="sun"></div>
        <div class="moon"></div>
    </div>

    <script>
        const body = document.body;
        const sun = document.querySelector('.sun');
        const moon = document.querySelector('.moon');

        // Toggle between day and night every 10 seconds
        setInterval(() => {
            body.classList.toggle('day');
            body.classList.toggle('night');
        }, 10000);
    </script>
</body>
</html>
